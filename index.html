/* =========================================================

/* =========================================================

========================================================= */

const definitions = {

/* =========================================================
   문제 유형
========================================================= */

const TYPES = [

    {
        id:"ENKO",
        title:"① 영어 → 한국어",
        description:
            "영어 단어의 가장 적절한 한국어 의미를 고르세요."
    },

    {
        id:"KOEN",
        title:"② 한국어 → 영어",
        description:
            "주어진 한국어 의미에 해당하는 영어 단어를 고르세요."
    },

    {
        id:"CLOZE",
        title:"③ Cloze / 문맥형",
        description:
            "문맥에 가장 적절한 단어를 고르세요."
    },

    {
        id:"RELATION",
        title:"④ 의미 관계형",
        description:
            "영어 정의와 가장 잘 맞는 단어를 고르세요."
    }

];


/* =========================================================
   시험 상태
========================================================= */

let round = 1;

let currentWords = [...allWords];

let currentSection = 0;

let sectionQuestions = [];

let sectionBank = {};

let sectionAnswers = {};

let allAnswers = {};

let roundResults = [];

let wrongWords = new Set();


/* =========================================================
   유틸리티
========================================================= */

function shuffle(array){

    const arr = [...array];

    for(
        let i=arr.length-1;
        i>0;
        i--
    ){

        const j =
            Math.floor(
                Math.random()*(i+1)
            );

        [arr[i],arr[j]] =
        [arr[j],arr[i]];

    }

    return arr;

}


function esc(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;");

}


function getMeaning(word){

    return vocabulary.find(
        x => x[0] === word
    )[1];

}


/* =========================================================
   문제 생성
========================================================= */

function makeSectionQuestions(type){

    let questions=[];


    currentWords.forEach(word=>{

        const meaning =
            getMeaning(word);


        const others =
            allWords.filter(
                x => x !== word
            );


        let choices;

        let prompt;

        let answer;


        /* ---------------------------------------------
           ① 영어 → 한국어
        --------------------------------------------- */

        if(type === "ENKO"){

            const distractors =
                shuffle(
                    others.map(
                        x => getMeaning(x)
                    )
                ).slice(0,4);


            choices =
                shuffle([
                    meaning,
                    ...distractors
                ]);


            prompt = word;

            answer = meaning;

        }


        /* ---------------------------------------------
           ② 한국어 → 영어
        --------------------------------------------- */

        else if(type === "KOEN"){

            const distractors =
                shuffle(others)
                .slice(0,4);


            choices =
                shuffle([
                    word,
                    ...distractors
                ]);


            prompt = meaning;

            answer = word;

        }


        /* ---------------------------------------------
           ③ Cloze
        --------------------------------------------- */

        else if(type === "CLOZE"){

            const distractors =
                shuffle(others)
                .slice(0,4);


            choices =
                shuffle([
                    word,
                    ...distractors
                ]);


            prompt = contexts[word];

            answer = word;

        }


        /* ---------------------------------------------
           ④ 의미 관계형
        --------------------------------------------- */

        else{

            const distractors =
                shuffle(
                    others.map(
                        x => definitions[x]
                    )
                ).slice(0,4);


            choices =
                shuffle([
                    definitions[word],
                    ...distractors
                ]);


            prompt =
                `Which description best matches "${word}"?`;

            answer =
                definitions[word];

        }


        questions.push({

            word,
            prompt,
            choices,
            answer

        });

    });


    return shuffle(questions);

}


/* =========================================================
   섹션 렌더링
========================================================= */

function renderSection(){

    const type =
        TYPES[currentSection];


    currentQuestions =
        makeSectionQuestions(type.id);


    sectionQuestions =
        currentQuestions;


    sectionBank[type.id] =
        currentQuestions;


    sectionAnswers = {};


    const quiz =
        document.getElementById("quiz");


    quiz.innerHTML = "";


    const section =
        document.createElement("div");


    section.className =
        "section active";


    let html = `

        <div class="section-header">

            <h2>
                ${type.title}
            </h2>

            <p>
                ${type.description}
            </p>

            <p>
                총 ${currentWords.length}문항
            </p>

        </div>

    `;


    currentQuestions.forEach(
        (q,index)=>{

            let choicesHTML="";


            q.choices.forEach(
                (choice,i)=>{

                    choicesHTML += `

                        <label
                            class="choice"
                            onclick="selectChoice(this)"
                        >

                            <input
                                type="radio"
                                name="q${index}"
                                value="${esc(choice)}"
                            >

                            ${String.fromCharCode(65+i)}.
                            ${esc(choice)}

                        </label>

                    `;

                }
            );


            html += `

                <div
                    class="question"
                    data-index="${index}"
                >

                    <div class="qno">
                        Q${index+1}
                    </div>

                    <div class="prompt">
                        ${esc(q.prompt)}
                    </div>

                    ${choicesHTML}

                </div>

            `;

        }

    );


    section.innerHTML = html;

    quiz.appendChild(section);


    addNavigation();

    updateProgress();

}


/* =========================================================
   선택 표시
========================================================= */

function selectChoice(label){

    const question =
        label.closest(".question");


    question
        .querySelectorAll(".choice")
        .forEach(
            x => x.classList.remove("selected")
        );


    label.classList.add("selected");

}


/* =========================================================
   진행률
========================================================= */

function updateProgress(){

    const percent =
        ((currentSection+1)/4)*100;


    document.getElementById(
        "progressBar"
    ).style.width =
        percent + "%";


    document.getElementById(
        "progressText"
    ).textContent =
        `${TYPES[currentSection].title} · ${currentSection+1} / 4`;


    document.getElementById(
        "roundTitle"
    ).textContent =
        round === 1
        ? "1차 시험"
        : `${round}차 재시험`;

}


/* =========================================================
   현재 섹션 순서 섞기
========================================================= */

function shuffleCurrentSection(){

    renderSection();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================================
   네비게이션 버튼
========================================================= */

function addNavigation(){

    const quiz =
        document.getElementById("quiz");


    const nav =
        document.createElement("div");


    nav.className="nav";


    const previous =
        document.createElement("button");


    previous.className =
        "secondary";


    previous.textContent =
        "← 이전 섹션";


    previous.disabled =
        currentSection === 0;


    previous.onclick =
        previousSection;


    const next =
        document.createElement("button");


    if(currentSection === 3){

        next.textContent =
            "시험 제출 · 채점하기";

    }

    else{

        next.textContent =
            "다음 섹션 →";

    }


    next.onclick =
        nextSection;


    nav.appendChild(previous);

    nav.appendChild(next);

    quiz.appendChild(nav);

}


/* =========================================================
   섹션 답안 저장
========================================================= */

function saveCurrentSection(){

    const cards =
        document.querySelectorAll(
            ".question"
        );


    sectionAnswers={};


    cards.forEach(
        (card,index)=>{

            const selected =
                card.querySelector(
                    "input:checked"
                );


            if(selected){

                sectionAnswers[index] =
                    selected.value;

            }

        }
    );


    allAnswers[currentSection] =
        sectionAnswers;

}


/* =========================================================
   다음 섹션
========================================================= */

function nextSection(){

    saveCurrentSection();


    const cards =
        document.querySelectorAll(
            ".question"
        );


    let unanswered=0;


    cards.forEach(card=>{

        if(
            !card.querySelector(
                "input:checked"
            )
        ){

            unanswered++;

        }

    });


    if(unanswered > 0){

        const go =
            confirm(
                `아직 ${unanswered}문제를 풀지 않았습니다.\n\n`+
                `그래도 다음 섹션으로 이동하시겠습니까?`
            );


        if(!go){

            return;

        }

    }


    if(currentSection < 3){

        currentSection++;


        renderSection();


        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

    else{

        finishRound();

    }

}


/* =========================================================
   이전 섹션
========================================================= */

function previousSection(){

    saveCurrentSection();


    if(currentSection <= 0){

        return;

    }


    currentSection--;


    renderSection();


    /*
       이전 섹션으로 돌아왔을 때
       기존 답안을 복원
    */

    restoreAnswers();


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================================
   답안 복원
========================================================= */

function restoreAnswers(){

    const answers =
        allAnswers[currentSection];


    if(!answers){

        return;

    }


    const cards =
        document.querySelectorAll(
            ".question"
        );


    Object.entries(answers)
        .forEach(
            ([index,value])=>{

                const card =
                    cards[index];


                if(!card){

                    return;

                }


                const input =
                    [...card.querySelectorAll(
                        "input"
                    )]
                    .find(
                        x => x.value === value
                    );


                if(input){

                    input.checked=true;

                    input.parentElement
                        .classList.add(
                            "selected"
                        );

                }

            }
        );

}


/* =========================================================
   최종 채점
========================================================= */

function finishRound(){

    saveCurrentSection();


    let totalQuestions =
        currentWords.length * 4;


    let totalCorrect=0;


    wrongWords =
        new Set();


    roundResults=[];


    TYPES.forEach(
        (type,typeIndex)=>{

            const questions =
                sectionBank[type.id];


            let correct=0;


            questions.forEach(
                (q,index)=>{

                    const selected =
                        allAnswers[typeIndex]
                        ? allAnswers[typeIndex][index]
                        : null;


                    if(
                        selected === q.answer
                    ){

                        correct++;

                    }

                    else{

                        wrongWords.add(
                            q.word
                        );

                    }

                }
            );


            roundResults.push({

                title:type.title,

                correct,

                total:currentWords.length

            });


            totalCorrect += correct;

        }
    );


    const accuracy =
        Math.round(
            totalCorrect /
            totalQuestions *
            100
        );


    showResult(
        totalCorrect,
        totalQuestions,
        accuracy
    );

}


/* =========================================================
   결과 표시
========================================================= */

function showResult(
    score,
    total,
    accuracy
){

    document.getElementById(
        "quiz"
    ).innerHTML="";


    document.getElementById(
        "shuffleButton"
    ).style.display="none";


    document.getElementById(
        "progressBar"
    ).style.width="100%";


    document.getElementById(
        "progressText"
    ).textContent=
        "시험 완료";


    const result =
        document.getElementById(
            "result"
        );


    result.style.display="block";


    document.getElementById(
        "totalScore"
    ).textContent =
        `${score} / ${total}점`;


    document.getElementById(
        "totalAccuracy"
    ).textContent =
        `정답률 ${accuracy}%`;


    const sectionScores =
        document.getElementById(
            "sectionScores"
        );


    sectionScores.innerHTML="";


    roundResults.forEach(
        r=>{

            const percent =
                Math.round(
                    r.correct /
                    r.total *
                    100
                );


            sectionScores.innerHTML += `

                <div class="section-result">

                    <strong>
                        ${r.title}
                    </strong>

                    <br>

                    점수:
                    ${r.correct} / ${r.total}점

                    ·

                    정답률:
                    ${percent}%

                </div>

            `;

        }
    );


    const wrongArea =
        document.getElementById(
            "wrongArea"
        );


    if(wrongWords.size === 0){

        wrongArea.innerHTML = `

            <h2>
                🎉 완벽합니다!
            </h2>

            <div class="notice">

                이번 시험에서 모든 문제를 맞혔습니다.<br>
                재시험할 단어가 없습니다.

            </div>

            <button onclick="exportPDF()">
                📄 성적표 PDF로 저장
            </button>

        `;

    }

    else{

        const list =
            document.getElementById(
                "wrongWords"
            );


        list.innerHTML="";


        [...wrongWords]
            .sort()
            .forEach(
                word=>{

                    const chip =
                        document.createElement(
                            "span"
                        );


                    chip.className =
                        "word-chip";


                    chip.textContent =
                        word;


                    list.appendChild(chip);

                }
            );


        wrongArea.dataset.words =
            JSON.stringify(
                [...wrongWords]
            );

    }


    /*
       PDF용 성적표 생성
    */

    makePDFReport(
        score,
        total,
        accuracy
    );


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================================
   PDF 성적표 생성
========================================================= */

function makePDFReport(
    score,
    total,
    accuracy
){

    document.getElementById(
        "pdfRound"
    ).textContent =
        round === 1
        ? "1차 시험"
        : `${round}차 재시험`;


    document.getElementById(
        "pdfScore"
    ).textContent =
        `${score} / ${total}점`;


    document.getElementById(
        "pdfAccuracy"
    ).textContent =
        `정답률 ${accuracy}%`;


    const sections =
        document.getElementById(
            "pdfSections"
        );


    sections.innerHTML="";


    roundResults.forEach(
        result=>{

            const percent =
                Math.round(
                    result.correct /
                    result.total *
                    100
                );


            sections.innerHTML += `

                <div class="pdf-section">

                    <div class="pdf-section-title">
                        ${result.title}
                    </div>

                    <div>
                        점수:
                        <strong>
                            ${result.correct}
                            /
                            ${result.total}점
                        </strong>
                    </div>

                    <div>
                        정답률:
                        <strong>
                            ${percent}%
                        </strong>
                    </div>

                </div>

            `;

        }
    );


    const wrongWordsArea =
        document.getElementById(
            "pdfWrongWords"
        );


    if(wrongWords.size === 0){

        wrongWordsArea.innerHTML =
            "없음 · 모든 문제 정답";

    }

    else{

        wrongWordsArea.innerHTML =
            [...wrongWords]
            .sort()
            .map(
                word => `

                    <span style="
                        display:inline-block;
                        background:#eee;
                        border-radius:999px;
                        padding:5px 10px;
                        margin:3px;
                    ">
                        ${esc(word)}
                    </span>

                `
            )
            .join("");

    }

}


/* =========================================================
   PDF / 인쇄
========================================================= */

function exportPDF(){

    /*
       브라우저의 기본 인쇄 기능을 사용합니다.

       Chrome / Edge에서
       "대상 → PDF로 저장"
       을 선택하면 PDF 파일로 저장됩니다.
    */

    window.print();

}


/* =========================================================
   오답 단어만 재시험
========================================================= */

function retryWrongWords(){

    const wrongArea =
        document.getElementById(
            "wrongArea"
        );


    const words =
        JSON.parse(
            wrongArea.dataset.words ||
            "[]"
        );


    if(words.length === 0){

        return;

    }


    round++;


    currentWords =
        words;


    currentSection=0;


    sectionAnswers={};

    allAnswers={};

    sectionBank={};

    roundResults=[];

    wrongWords =
        new Set();


    document.getElementById(
        "result"
    ).style.display="none";


    document.getElementById(
        "shuffleButton"
    ).style.display="block";


    renderSection();


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================================
   시작
========================================================= */

let currentQuestions=[];

renderSection();

</script>

</body>
</html>
